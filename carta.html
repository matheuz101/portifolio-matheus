<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Carta de habilidade — HTML5</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                min-height: 100vh;
                min-height: 100svh;
                margin: 0;
                padding: 32px 24px;
                place-items: center;
                background: #0b0b0b;
                color: #fff;
                font-family: Georgia, "Times New Roman", serif;
            }

            .skills-demo {
                width: 100%;
                text-align: center;
            }

            .skills-title {
                margin: 0;
                font-size: 18px;
                font-weight: 700;
                line-height: 1.2;
            }

            .letter-stage {
                display: flex;
                justify-content: center;
                padding-block: 144px 48px;
            }

            /* Altere apenas esta largura para reutilizar a carta em uma grade. */
            .skill-card {
                --letter-width: 320px;
                --fold-duration: 550ms;

                position: relative;
                isolation: isolate;
                display: block;
                width: var(--letter-width);
                max-width: 100%;
                aspect-ratio: 1194 / 574;
                padding: 0;
                border: 0;
                border-radius: 2% / 4%;
                appearance: none;
                background: transparent;
                cursor: pointer;
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
            }

            .skill-card:focus-visible {
                outline: 2px solid #e1ba75;
                outline-offset: 8px;
            }

            .skill-card span,
            .skill-card img {
                position: absolute;
                display: block;
                pointer-events: none;
                user-select: none;
            }

            /* O pergaminho ocupa só parte do PNG: o recorte exclui o fundo marrom. */
            .env-paper {
                background-image: url("imgs/bg-letter.png");
                background-repeat: no-repeat;
                background-size: 128.64% 178.4%;
                background-position: 50.88% 34.44%;
            }

            .env-back {
                z-index: 1;
                inset: 0;
                border-radius: inherit;
                box-shadow: 0 1px 3px #0006;
            }

            /* A dobra inferior fica na frente das laterais do envelope. */
            .env-pocket {
                z-index: 2;
                inset: 0;
                overflow: hidden;
                border-radius: inherit;
            }

            .env-pocket::before,
            .env-pocket::after {
                position: absolute;
                inset: 0;
                content: "";
                clip-path: polygon(0 100%, 50% 15%, 100% 100%);
            }

            .env-pocket::before {
                background: #b27b42;
            }

            .env-pocket::after {
                background: inherit;
                transform: translateY(1px);
            }

            .env-icon {
                z-index: 3;
                top: 0;
                left: 50%;
                width: 35%;
                height: auto;
                aspect-ratio: 1;
                object-fit: contain;
                opacity: 0;
                transform: translate(-50%, 24%) scale(0.8);
                transition:
                    transform 400ms ease,
                    opacity 180ms ease;
            }

            /* A origem da rotação acompanha a borda superior do corpo. */
            .env-flap {
                z-index: 4;
                inset: 0 0 auto;
                height: 80%;
                transform-origin: center top;
                transition:
                    transform var(--fold-duration) ease-in-out,
                    z-index 0s calc(var(--fold-duration) / 2);
            }

            .env-flap-crop {
                inset: 0;
                overflow: hidden;
                border-radius: 2% 2% 0 0 / 5% 5% 0 0;
            }

            /* A aba e o selo têm margens transparentes próprias. */
            .env-flap img {
                top: -2.8%;
                left: -1.55%;
                width: 103.1%;
                height: 105.7%;
            }

            .env-seal {
                z-index: 5;
                top: 63%;
                left: 50%;
                width: 13%;
                height: auto;
                transform: translateX(-50%);
            }

            .skill-card.open .env-flap {
                z-index: 0;
                transform: rotateX(180deg);
            }

            .skill-card.open .env-icon {
                opacity: 1;
                transform: translate(-50%, -28%) scale(1);
                transition-delay: 220ms;
            }

            @media (prefers-reduced-motion: reduce) {
                .skill-card .env-flap,
                .skill-card .env-icon {
                    transition: none;
                }
            }
        </style>
    </head>
    <body>
        <main class="skills-demo" aria-labelledby="skills-title">
            <h1 class="skills-title" id="skills-title">SKILLS</h1>

            <div class="letter-stage">
                <!-- Para outra habilidade, duplique o botão e troque data-skill e o ícone. -->
                <button
                    class="skill-card"
                    type="button"
                    data-skill="HTML5"
                    aria-pressed="false"
                    aria-label="Abrir carta da habilidade HTML5"
                >
                    <span class="env-back env-paper" aria-hidden="true"></span>
                    <span class="env-pocket env-paper" aria-hidden="true"></span>
                    <img class="env-icon" src="imgs/html-icon.png" alt="" draggable="false">
                    <span class="env-flap" aria-hidden="true">
                        <span class="env-flap-crop">
                            <img src="imgs/top-letter.png" alt="" draggable="false">
                        </span>
                    </span>
                    <img class="env-seal" src="imgs/selo-letter.png" alt="" draggable="false">
                </button>
            </div>
        </main>

        <script>
            document.querySelectorAll('.skill-card').forEach((card) => {
                function setOpen(isOpen) {
                    card.classList.toggle('open', isOpen);
                    card.setAttribute('aria-pressed', String(isOpen));
                    card.setAttribute(
                        'aria-label',
                        `${isOpen ? 'Fechar' : 'Abrir'} carta da habilidade ${card.dataset.skill}`
                    );
                }

                setOpen(card.classList.contains('open'));

                // O botão nativo também responde a Enter, Espaço e toque.
                card.addEventListener('click', () => {
                    setOpen(!card.classList.contains('open'));
                });

                card.addEventListener('keydown', (event) => {
                    if (event.key === 'Escape') {
                        setOpen(false);
                    }
                });
            });
        </script>
    </body>
</html>
